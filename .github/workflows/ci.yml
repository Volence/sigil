name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # WHAT A GREEN BADGE ON THIS WORKFLOW MEANS — and what it does not.
      #
      # CI checks out only this repo. Every REFERENCE-DEPENDENT test — anything
      # compiling sources out of the sibling aeon tree, plus the m1b_gate
      # checksum/s4budget/Oracle gates — is left UNMEASURED here.
      #
      # CI IS A DECLARED PARTIAL RUN, and `SIGIL_ALLOW_PARTIAL=1` below is how it
      # says so. That is the `d-18` opt-in: without it, a run that resolves no
      # reference tree STOPS rather than passing green over the rows it did not
      # run. With it, those rows skip against a self-describing absent path and
      # the harness prints, once, how many test binaries it left alone — a number
      # it DERIVES from this repo's own test sources rather than one anybody typed.
      #
      # WHY THERE IS NO LONGER AN `AEON_DIR` SENTINEL. This step used to point
      # AEON_DIR at `/nonexistent/aeon-not-checked-out-in-ci` to mean "no tree
      # here". Under the SUITE_PATHS precedence a checkout variable that is SET BUT
      # WRONG is a hard error at its own step — deliberately, because a wrong value
      # is evidence of a wrong environment and resolving around it would measure
      # against a tree nobody asked for. So the sentinel stopped meaning "absent"
      # and started meaning "misconfigured", and on 2026-09-02 it turned every
      # reference-dependent row in CI into a failure. Absence is now spelled the
      # way the precedence spells it: the variable is not set.
      #
      # Unset, the resolver can reach only its own derivation (step 3) or its
      # refusal (step 4), and `aeon_dir` refuses a step-3 derivation as a reference
      # tree by design — a tree nobody named cannot be what a result is attributed
      # to. So both land in the partial path, and that is true whatever the runner's
      # filesystem happens to hold: no sibling checkout can quietly become CI's
      # oracle. The one spelling that COULD is an explicit AEON_DIR or
      # EMPYREAN_SUITE_ROOT, neither of which this workflow sets — and if one ever
      # appeared, the skip count below would fall to zero and the next step fails.
      #
      # That skip set is LARGE and it is NOT self-announcing: a runtime skip
      # returns early and the harness counts it as a PASS. Roughly 400 rows skip
      # here, and every build-and-compare golden gate is among them —
      # each `native_offcanonical_rom` anchor compare, all `native_offcanonical_full`,
      # the placement gates, `native_full_rom`, both `native_rom`, `pins_rs_is_current`,
      # `m1b_gate`, `m1c_vector_table`, and the `seam1_native_link` set.
      #
      # So: A GREEN RUN HERE CARRIES ZERO WHOLE-ROM BYTE EVIDENCE. It proves the
      # workspace compiles, clippy is clean, and the reference-INdependent tests
      # pass. The byte gate runs pre-merge locally with SIGIL_STRICT_GATE=1 in an
      # env that HAS the sibling aeon/oracle repos; under that flag the same guard
      # PANICS instead of skipping, so a green CI can never stand in for it.
      # SIGIL_STRICT_GATE and SIGIL_ALLOW_PARTIAL describe opposite runs and the
      # resolver refuses both at once, which is why this workflow sets only one.
      #
      # `refreeze --check` is not that gate either — it reads the committed
      # golden blobs and recomputes their CRCs, so it compares two committed files
      # with each other and never builds anything.
      #
      # The skip count is reported below rather than left invisible, so a change
      # that silently moves tests INTO the skip set is visible in the log instead
      # of showing up as "still green".
      - name: test
        env:
          SIGIL_ALLOW_PARTIAL: "1"
        run: |
          # pipefail is mandatory: without it the pipeline reports `tee`'s exit
          # status and a failing suite reads as green. That exact shape (an
          # aggregate through `head` returning 0 while tests were red) has already
          # cost one bad merge.
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee test-output.txt

      - name: report reference-dependent skips
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f test-output.txt ]; then
            echo "no test output captured — nothing to report"
            exit 0
          fi
          total=$(grep -c '^skip: ' test-output.txt || true)
          echo "==================================================================="
          echo " reference-dependent gates SKIPPED in this run: ${total}"
          echo " (each one is counted as a PASS by the test harness)"
          echo "==================================================================="
          # THE ZERO CASE IS DECIDED BEFORE THE BREAKDOWN, not after. Under this
          # step's `set -e`, a `grep` that matches nothing exits 1 and kills the
          # step — so with the check below the breakdown, the one case this whole
          # step exists to explain produced a bare red and none of the text that
          # explains it. A count of zero means the skip mechanism itself broke (or
          # the reporter stopped matching), which would silently restore the false
          # reassurance this step exists to remove. It is also what catches an
          # AEON_DIR or EMPYREAN_SUITE_ROOT arriving in this workflow's
          # environment: that is the only way CI could start measuring against a
          # tree, and it shows up here as the skips disappearing rather than as a
          # quietly bigger green.
          if [ "${total}" -eq 0 ]; then
            echo "ERROR: expected reference-dependent skips in CI and found none —"
            echo "either a reference tree was named (AEON_DIR / EMPYREAN_SUITE_ROOT),"
            echo "or the skip reporting broke. CI is a DECLARED PARTIAL run"
            echo "(SIGIL_ALLOW_PARTIAL=1); with a real tree named it is not, and this"
            echo "workflow would be claiming evidence it has no way to produce."
            exit 1
          fi
          # NO EARLY-EXITING READER ENDS THIS PIPELINE, and that is load-bearing.
          # The last stage was `head -40`, which exits the moment it has 40 lines;
          # `sort -rn` upstream is then killed by SIGPIPE and `pipefail` hands the
          # pipeline back 141, which under `set -e` fails the step — a red that
          # says nothing about the code under test, arriving only when there was
          # MORE to report. `awk` reads to EOF, so there is no signal to take, and
          # it says out loud when it truncated rather than dropping the tail the
          # way `head` did.
          grep '^skip: ' test-output.txt \
            | sed -E 's#(set AEON_DIR)#\1#; s#/[^ ]*/([^/ ]+)#.../\1#g' \
            | sort | uniq -c | sort -rn \
            | awk 'NR <= 40 { print }
                   END { if (NR > 40) printf "  ... and %d further distinct skip line(s) not shown\n", NR - 40 }'
          echo "-------------------------------------------------------------------"
          echo "A green run above does NOT prove any whole-ROM byte claim."
          echo "Run the byte gate locally: SIGIL_STRICT_GATE=1 with AEON_DIR set to"
          echo "the sibling aeon checkout, which turns every skip above into a panic."

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: crate-graph guard
        run: cargo test -p sigil-cli --test crate_graph
