name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # CI checks out only this repo. Every REFERENCE-DEPENDENT test — anything
      # compiling sources out of the sibling aeon tree, plus the m1b_gate
      # checksum/s4budget/Oracle gates — self-skips here via
      # `sigil_harness::test_support::reference_tree`. AEON_DIR is pointed at a
      # path that cannot exist so the skip is what CI exercises, rather than
      # depending on the runner not happening to have the default path.
      #
      # Those fidelity gates run pre-merge locally with SIGIL_STRICT_GATE=1 in
      # an env that HAS the sibling aeon/oracle repos; under that flag the same
      # guard panics instead of skipping, so a green CI can never stand in for
      # the byte gate.
      - name: test
        env:
          AEON_DIR: /nonexistent/aeon-not-checked-out-in-ci
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: crate-graph guard
        run: cargo test -p sigil-cli --test crate_graph
