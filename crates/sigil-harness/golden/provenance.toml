[entry.superseded]
by = "preset-sec5-split-attested"
reason = "entry 190 went RED and can never be attested: 38 failures, of which 36 were ARTIFACT SUBSTITUTION, not stray files - cargo's unit hash is checkout-independent, so a worktree sharing the target dir wrote deps/<name>-<hash> with its own absolute CARGO_MANIFEST_DIR baked in, the main checkout saw a matching fingerprint and did NOT rebuild, and ran a binary compiled against another checkout's paths. Silent while both checkouts exist (sources match, tests pass); becomes red only when the other worktree is deleted, days later, in someone else's run, with no causal link visible. Sigil proved it from this attest's own suite log: cargo ran the ORPHAN hashes and never ran the correctly-baked ones, and after deletion rebuilt at the IDENTICAL hashes. So 'never share a CARGO_TARGET_DIR between worktrees' is a CORRECTNESS rule, not a conflict rule, and cargo clean does not fix it - only a per-worktree target dir does. The other 2 failures were this lane's own real defect: collision_data_port hand-filters engine/objects/dplc.emp to two comptime fns BY NAME, so the DPLC ceiling rider's new cross-seam const DPLC_ADDRESSABLE_TILES was filtered out and the standalone lower failed with unknown name, while all four ROM shapes built green and 1774 python tests passed. Fixed at sigil ff6d69dc by admitting Item::Const wholesale. The durable lesson: A ZERO-BYTE CLAIM IS A CLAIM ABOUT BYTES AND SAYS NOTHING ABOUT NAMES."

