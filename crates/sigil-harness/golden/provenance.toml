[[entry]]
name = "glide-angle-resolution"
ab = "aeon b12c0141 (code e51858c2): Glide_Collide substitutes the down cardinal for an ODD probe angle between Collision_ProbeDown and the write to angle(a0) - 8 bytes, matching S3K's Sonic_CheckFloor (sonic3k.asm:19890-19893, d2 pre-set 0 at :19879). THE BUG WAS ORDINARY FLOOR: attrs $01 and $03, the bulk floor of OJZ act 1, are S&K shape-255 full blocks carrying angle $FF, so every glide landing on normal ground installed a bad angle. Jump on the first grounded frame and PState_Ground runs its jump check before the floor pair, projecting through $FF for a phantom -36 leftward kick on flat ground; Air_Collide's decay then cycles $FF/$01 forever. Confined to Knuckles: Glide_Collide's only callers are PState_Glide/PState_GlideFall via CharDef_Knuckles.cd_ability, asserted by the gate. Four shapes from a clean detached worktree of the merge SHA, SIGIL_BUILD md5 85ba502f096773780cbbac17b5d77890 re-pinned at the moment of dependence and unchanged before and after: s4 a2acd485->974d2764 (719029->719049), s4.debug ac752821->e1f02631 (735642->735662), demo 3415e3ef and demo.debug 7599953e BOTH BYTE-IDENTICAL - the witness that nothing outside Knuckles moved. Gate tools/test_glide_angle_resolution.py, 5 tests in build.sh's build-fatal pytest lane, red-first proven (deleting the three instructions fails 2/5 naming the sentinel and the decay-termination cases), expectations DERIVED - the substituted 0 parsed out of sonic3k.asm at test time, the decay step out of player_air.emp, the population out of the interned tables, refusing to pass on an empty population. Honest limit stated in its docstring: source+data gate, not runtime. The divergence half is BLOCKED and booked for the owner - it would reject every glide landing on a genuine 45-degree slope, which is behaviour on correctly-labelled terrain."
