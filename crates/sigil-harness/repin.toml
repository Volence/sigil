# repin.toml — the declarative pin manifest (tranche-10 step 0, D-T10.2).
#
# `cargo run -p sigil-harness --bin repin` resolves every entry against BOTH
# aeon listings (s4.lst / s4.debug.lst) and regenerates src/pins.rs. Order is
# load-bearing: pins.rs emits in manifest order. Adding a region/symbol is a
# manifest edit + regenerate — the tool never re-pins a NEW region into
# existence on its own.
#
# `tests` lists name the test BINARIES that consume the pin — printed as the
# rerun hint when the pin moves. (dplc_port/core_port are tranche 10's
# to-be-written binaries; their regions are pinned ahead per the handoff.)
#
# Inventory transcribed 2026-07-10 from the hand-typed pins in:
#   sigil-cli tests: rings_port collision_port collision_lookup_port
#     game_loop_port test_objects_port sound_api_port animate_port
#     sonic_anims_port particle_anims_port controllers_port math_port
#     vdp_init_port hblank_port act_descriptor_port
#   sigil-harness tests: m1d_rom m1d_debug_rom m1c_vector_table
#     (+ mixed_dac_rom's ASSEMBLED_LEN twins)
# Every value was cross-checked against both listings before ratifying the
# start/end symbols below.

[rom]
# The listing END-line address per shape — the assembled (pre-convsym) ROM
# lengths ASSEMBLED_LEN / DEBUG_ASSEMBLED_LEN.
end_symbol = "__END__"
tests = ["m1d_rom", "m1d_debug_rom", "mixed_dac_rom"]

# ── Gated regions, engine.inc ladder order ──────────────────────────────────

[[region]]
# Tranche 26 — the engine-owned 64-entry CPU/interrupt/trap vector table
# (vectors.emp), `org 0`, exactly $000-$0FF. FIXED SIZE and PRECEDES EVERYTHING
# — base 0 both shapes, a literal $100 length (shape-invariant; the region is
# pure data whose VALUES differ per shape through the link, never its size). The
# byte gate window is [0, $100). start = Vectors (the table's head label).
name = "vectors"
start = "Vectors"
len = 0x100
gate = "SIGIL_EMP_VECTORS"
tests = ["vectors_port"]

# Parcel K4 — the $100-$1FF ROM header, native (was header.inc's gameHeader macro).
# No gate: no AS twin (header.inc deleted, the gameHeader invocation removed from
# engine.inc). Head label GameHeader ($100); end = EntryPoint ($200).
[[region]]
name = "header"
start = "GameHeader"
end = "EntryPoint"
tests = ["header_port"]

# Parcel K4 — the collision/character data island (HeightMaps .. Art_Sonic end).
# No gate: no AS twin (the BINCLUDEs were deleted from main.asm). Literal len (the
# blobs are fixed-size, shape-invariant); the next placement is $8000-aligned pad
# to the DAC bank, so no end label sits at the island's true end.
[[region]]
name = "collision_data"
start = "HeightMaps"
len = 0x1C480
tests = ["collision_data_port"]

[[region]]
# Tranche 23 — the boot sequence (EntryPoint/Warm/Cold fall-through chain).
# End is the data tail's head: boot_data.asm's BootData table (the .emp
# reaches it cross-seam via `lea BootData(pc)`). FIRST region in the engine
# chain — every downstream base slides with any boot byte-change (gap-ledger
# row 1257 bar: batched wave, one re-pin, full fixture sweep). Shape-DEPENDENT
# length: debug +4 (the `__DEBUG__` bsr.w CompressionSelfTest).
name = "boot"
start = "EntryPoint"
end = "BootData"
gate = "SIGIL_EMP_BOOT"
tests = ["boot_port"]

[[region]]
# Parcel K2 — the BootData table head (engine/system/boot_data.emp). Ungated
# (boot_data has no `.asm` twin — it is unconditionally native). Sound-on: head
# (54 B) + the resident driver blob; sound-off: the 54-byte head alone, then the
# engine.z80_init idle packs the $3d8..$3fe hole before boot_tail. end is the
# tail's head (BootData_PostBlob).
name = "boot_head"
start = "BootData"
end = "BootData_PostBlob"
tests = ["boot_data_port"]

[[region]]
# Parcel K2 — the BootData table tail (PSG silence + post-DMA commands). Resumes
# at $3fe in the no-sound shapes (the $3FE map hole's post-fill address), directly
# after the blob in sound-on. end = BootData_End (the table's one-past terminus,
# == VDP_Shadow_Init's base — boot_tail abuts it).
name = "boot_tail"
start = "BootData_PostBlob"
end = "BootData_End"
tests = ["boot_data_port"]

[[region]]
name = "vdp_init"
