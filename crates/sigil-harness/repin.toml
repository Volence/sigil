# `release_fault` HAS NO REGION HERE, deliberately. The old 2-byte NullInterrupt:rte
# stub it replaced is deleted (no vector referencer since item 27's ruling), and
# since the crash-report ruling `ReleaseFault` exists in NEITHER canonical shape —
# it is the LEAN profile's fault handler only (registry: the `else` of
# `debug || crash_report`). `repin` resolves labels against the canonical plain +
# debug listings alone, so there is no address here to pin: lean places the section
# from its frozen size table (`golden/offcanonical_sizes/lean.txt`) + map.toml
# `order`, exactly like every other off-canonical section, and its ModuleSpec
# carries DUMMY_REGION.

# Tranche 25 — the error_handler region, the TRUE ROM TAIL (see the replay_fixture
# note above: it must stay last): the 12 CPU exception-vector stubs
# (raise_exception) + the vendored MD Debugger blob. Length 0x10B0 (stub table
# 0x15A + blob 0xF56).
#
# IN BOTH CANONICAL SHAPES as of the crash-report ruling (owner-ruled 2026-08-04,
# superseding review item 29 part 4's release strip): the island + its deb2 symbol
# appendix are DIAGNOSTICS, not debug EQUIPMENT, and diagnostics ship — a player's
# crash has to be reportable. So `debug_only` / `plain_anchor` are GONE: both
# listings define `BusError`, and the region pins per shape like any ordinary one.
# The MDDBG__ equ table (debugger.asm) rides the same axis — its include in
# games/*/game_root.asm is gated on `__MDDBG__` (pushed when debug || crash_report),
# not `__DEBUG__`.
#
# `end = "EndOfRom"` — nothing is placed after it in EITHER canonical shape, by
# contract. THAT INVARIANT IS NOW MORE LOAD-BEARING, NOT LESS: it binds the SHIPPED
# release ROM, so a section placed after the island silently breaks the crash screen
# on a player's cartridge, not just in a dev build. It is enforced as a hard build
# error by `check_error_handler_is_last` (src/native.rs) and declared in each game's
# map.toml `order`.
[[region]]
name = "error_handler"
start = "BusError"
end = "EndOfRom"
gate = "SIGIL_EMP_ERROR_HANDLER"
tests = ["error_handler_port"]

