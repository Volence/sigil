# player_common is the object-bank FIRST code region (base = Player_Init, just
# past ObjCodeBase's safety rts + __BUDGET_OBJBANK); its end anchor is
# player_ground.asm's first emitted label PState_Ground (the surviving state
# file). player_common.asm uses an INTERNAL gate: its zero-byte header (PlayerV
# struct / _pl_* + PPHYS_* equates / the macros) stays ALWAYS-EMITTED so the
# surviving ground/air/spindash still resolve it; only the code span
# (Player_Init..Player_DebugMove) sits under SIGIL_EMP_PLAYER_COMMON. sonic is
# the last player file before test_static. Bank windows shape-invariant.
[[region]]
