# release convsym appendix and perturb the byte-identical plain ROM. `debug_len`
# (= the debug resume org − debug base) is emitted directly into pins.rs by repin;
# re-derive it on any sound_api debug-shape byte change.
name = "sound_api"
start = "Sound_PostByte"
