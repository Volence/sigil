# Effects P2: the same class, two parcels later — OJZ_TestGradient is the dense-tier
# gate fixture (Task 5, a 96-line OP_RUN_GRADIENT ramp) that act_descriptor names into
# section 2's sec_raster_table, and OJZ_ShimmerCycle is the Task 8 per-section cycling
# script it names into sec_pal_cycle. Both live in `parallax_configs` alongside the two
# P1 fixtures above, so both are cross-seam DATA operands from act_descriptor's side.
[[symbol]]
name = "OJZ_TestGradient"
tests = ["act_descriptor_port"]
[[symbol]]
name = "OJZ_ShimmerCycle"
tests = ["act_descriptor_port"]
# Effects P3 (vsram parcel): OJZ_TestVsram is the first VSRAM raster program — the
# plane B scroll-banding gate fixture act_descriptor names into section 0's
# sec_raster_table. Lives in `parallax_configs` with the others: cross-seam DATA
# operand from act_descriptor's side.
[[symbol]]
name = "OJZ_TestVsram"
tests = ["act_descriptor_port"]
# Effects ramp parcel: OJZ_TestRamp is the OP_RUN_RAMP gate fixture (computed per-line
# VSRAM values from a 16.16 accumulator) that act_descriptor names into section 0's
# sec_raster_table. Same class, same home in parallax_configs.
[[symbol]]
name = "OJZ_TestRamp"
tests = ["act_descriptor_port"]
# Effects P1: the raster dispatcher's RAM working set. They are engine.ram labels, so
# from engine.effects.raster's standalone re-lower they are inbound cross-seam RAM
# operands and raster_port has to be given their true per-shape VMAs.
[[symbol]]
name = "Raster_Program"
tests = ["raster_port"]
[[symbol]]
name = "Raster_Cursor"
tests = ["raster_port"]
[[symbol]]
name = "Raster_Pending"
tests = ["raster_port"]
[[symbol]]
name = "Raster_Buf_A"
tests = ["raster_port"]
[[symbol]]
name = "Raster_Active_Buf"
tests = ["raster_port"]
# Effects P1: vblank.emp calls into the dispatcher, so from the game-loop/vblank
# standalone re-lower Raster_VBlank is an outbound cross-seam CALL target.
[[symbol]]
name = "Raster_VBlank"
tests = ["game_loop_port", "vblank_port", "load_art_port", "boot_port"]
# Effects P1: Parallax_CheckBoundary was the single place the engine noticed a
# section crossing, so the palette and raster consumers hung off it — outbound
# cross-seam calls from parallax's standalone re-lower (Palette_LoadSection lived
# in buffers, Raster_InstallSection in hblank; Palette_InstallCycleSection joined
# them for Task 8's per-section palette cycling). All three, and this pin trio,
# were deleted in effects-P3-C2 Task 13: every OJZ section now carries a preset, so
# the legacy per-field "keep current" path Parallax_CheckBoundary's `.legacy` branch
# called them from is gone. The one outbound cross-seam call left at that site,
# Effects_InstallPreset, has never needed a pin here (added in an earlier C2 task,
# still unpinned) — parallax_port evidently does not require a VMA pin for it.
# Effects P2: the palette engine composes once per frame from GameLoop (arithmetic,
# not VDP work, so it is main-loop and not VBlank) — an outbound cross-seam call from
# the game_loop standalone re-lower, the peer of Raster_VBlank above.
[[symbol]]
name = "Palette_Compose"
tests = ["game_loop_port"]
# C1 (per-slot player working state): the single-global `Player_Phys` row +
# `Player_Quadrant` + `Player_JumpBuffer` are GONE — folded into a
# `[PlayerBlock; NUM_PLAYERS]` array whose ONE label is the array base. Every
# consumer now addresses the block a4-relative (a4 = the calling slot's block,
# established once per player frame by player_common's `player_block` splice), so
# `Player_Blocks` is the only cell name that survives as a cross-seam value and
# the `Player_Phys_End` adjacency marker has no referent (sizeof(PlayerBlock) is
# the stride now). player_ground/air/spindash/sensors reference NO player-state
# RAM label at all any more, which is why their pin rows retire with the cells.
[[symbol]]
name = "Player_Blocks"
tests = ["test_p1_player_port"]
[[symbol]]
name = "Player_Ring_Index"
tests = ["test_p1_player_port"]
[[symbol]]
name = "Player_Pos_Ring"
tests = ["test_p1_player_port"]
[[symbol]]
name = "Player_Stat_Ring"
tests = ["test_p1_player_port"]
[[symbol]]
name = "Player_Death_Pending"
tests = ["test_p1_player_port"]
# bug005 parcel (M3): the act-invariant clamp-edge cache Player_BoundsInit
# writes and the per-frame ground/air clamps read back (game ram.emp cells).
[[symbol]]
name = "Player_Bound_Right"
tests = ["test_p1_player_port"]
[[symbol]]
name = "Player_Bound_Bottom"
tests = ["test_p1_player_port"]
# dust Task 4/5 (aeon 26344203 / 24e7f6a0): player_common calls INTO the
# dust_spindash section — Player_Display calls Dust_Tick (the skid-dust cadence,
# Task 4) and PHook_SpindashEnter calls DustSpindash_Spawn (the charge-dust
# follower, Task 5). Dust_Tick is the dust_spindash REGION's start label, so it
# rides DUST_SPINDASH.plain_base/.debug_base and needs no symbol pin of its own;
# DustSpindash_Spawn sits at an interior offset, so the port test's synthetic
# anchor needs this pin.
[[symbol]]
name = "DustSpindash_Spawn"
tests = ["test_p1_player_port"]
