[package]
name = "sigil-frontend-emp"
version = "0.1.0"
edition = "2021"

[dependencies]
sigil-span = { path = "../sigil-span" }
sigil-ir = { path = "../sigil-ir" }
sigil-backend-z80 = { path = "../sigil-backend-z80" }
sigil-backend-m68k = { path = "../sigil-backend-m68k" }
sigil-salvador-sys = { path = "../sigil-salvador-sys" }
sigil-s4lz = { path = "../sigil-s4lz" }
sigil-clownlzss-sys = { path = "../sigil-clownlzss-sys" }
sigil-clownnemesis-sys = { path = "../sigil-clownnemesis-sys" }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }

[dev-dependencies]
sigil-link = { path = "../sigil-link" }
# The two corpus censuses in `tests/cfg_blind_spots.rs` reach the reference tree,
# and `contract/SUITE_PATHS.md` puts ONE resolver behind every such reach — a
# private copy of the precedence is a second thing to keep in step. The harness
# depends on this crate, so this edge closes a cycle THROUGH A DEV-DEPENDENCY,
# which cargo resolves: the harness's own build does not see it.
sigil-harness = { path = "../sigil-harness" }
tempfile = "3"
