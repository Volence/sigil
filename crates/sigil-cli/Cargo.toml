[package]
name = "sigil-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sigil"
path = "src/main.rs"

[build-dependencies]
# `build.rs` asks cargo for this binary's own dependency graph and reads the
# answer. Feature set matches the workspace's other serde_json consumer so the
# host artifact is shared rather than compiled a second time.
serde_json = { version = "1", features = ["preserve_order"] }

[dependencies]
sigil-frontend-as = { path = "../sigil-frontend-as" }
sigil-frontend-emp = { path = "../sigil-frontend-emp" }
sigil-harness = { path = "../sigil-harness" }
sigil-ir = { path = "../sigil-ir" }
sigil-link = { path = "../sigil-link" }
sigil-span = { path = "../sigil-span" }

[dev-dependencies]
tempfile = "3"
# `tests/m68k_cond_parity.rs` derives its expected encodings from the ISA's own
# `Cond` discriminants rather than transcribing them, so it needs the enum. A
# DEV-dependency only: `tests/crate_graph.rs` and `tests/version_provenance.rs`
# both filter by dependency kind, so this adds no edge to the shipping binary's
# graph and no edge the (c) contamination safeguard is about.
sigil-backend-m68k = { path = "../sigil-backend-m68k" }
# The closure gate re-derives this binary's dependency graph from cargo at test
# time and holds the banner to it.
serde_json = { version = "1", features = ["preserve_order"] }
