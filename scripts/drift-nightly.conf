# Runtime configuration for the aeon-reference drift job (scripts/nightly_ref_drift.sh).
#
# THIS FILE IS THE JOB'S ONLY SOURCE OF N. Nothing in the harness compiles a chain
# count in and nothing defaults to one: `drift_report.py` requires `--n` and the shell
# job refuses to run when this file does not set it. Changing N is an edit here, never
# a source change and never a parcel.
#
# Sourced by bash. Keep it to `KEY=value` — it is executed, not parsed.

# ── N, THE CHAIN COUNT ───────────────────────────────────────────────────────────
# The number of CHAINS whose quiet the owner asked to see before the evidence is
# weighed. Ruled 5 by the hub in the owner's place, PROVISIONALLY and explicitly
# overturnable: aeon's plan (docs/superpowers/plans/2026-08-27-sigil-decouple-steps-1-4.md
# §3) calls N "the one number in this plan neither lane should choose".
#
# A CHAIN IS A DISTINCT REVISION PAIR, NOT A NIGHT. The provenance chain counts one
# entry per paired landing (186 today), which is the unit the ruling was about; five
# nights that all observe the same pair are one chain's worth of evidence, and the
# report counts distinct pairs for exactly that reason.
DRIFT_CHAIN_TARGET_N=5

# The environment variable SIGIL_DRIFT_N overrides this for one run. The report always
# names which of the two the value came from — a number whose origin is invisible is
# the class of defect this lane spends its nights on.

# ── THE RECORD SEAM ──────────────────────────────────────────────────────────────
# The expected CRCs come from a record the AEON lane owns and generates (their plan's
# §2 item 1). This job holds no expectation of its own and must never derive one: a
# drift job whose expectations it generated itself measures nothing.
#
# DRIFT_RECORD_READER is a command implementing the protocol in
# docs/DRIFT_RECORD_SEAM.md. Empty means the record does not exist yet, and the job
# reports NOTHING MEASURED — not a pass, not a zero, not green.
DRIFT_RECORD_READER="/home/volence/sonic_hacks/.aeon-ref-drift/tools/drift_record.py"

# ── SHAPES ───────────────────────────────────────────────────────────────────────
# The ROM shapes to measure, space separated, named as `<shape>:<file>` relative to
# the reference tree. When the record exists, the job set-diffs this list against the
# reader's `shapes` verb in both directions and NAMES any shape on one side only,
# because a shape the record covers and the job never builds reads as coverage.
DRIFT_SHAPES="s4:s4.bin s4_debug:s4.debug.bin demo:demo.bin demo_debug:demo.debug.bin"

# ── PATHS ────────────────────────────────────────────────────────────────────────
# The reference checkout the job builds. ARTIFACT-BEARING and therefore NOT the
# source-gate lane's tree: scripts/nightly_source_gates.sh scrubs *.bin/*.lst out of
# its own checkout mid-run, and sharing one would delete this job's ROMs under it.
DRIFT_AEON_TREE=/home/volence/sonic_hacks/.aeon-ref-drift

# The append-only observation ledger. MACHINE-LOCAL: it lives outside every repo, so
# the accumulated evidence does NOT survive this machine. The report prints that
# limitation on every run rather than leaving a reader to assume durability.
DRIFT_LEDGER="${XDG_STATE_HOME:-$HOME/.local/state}/sigil-ref-drift/observations.jsonl"

# Paths asserted ABSENT by sigil's own tests, which the reference-path sweep must not
# report as drift. Self-checking: every row names the file that asserts the absence,
# and the sweep fails loud when that file stops naming the path.
DRIFT_EXPECTED_ABSENT="scripts/drift-expected-absent.txt"
